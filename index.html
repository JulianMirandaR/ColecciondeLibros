<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Stock de Productos</title>
</head>

<body>
    <div class="container main-container">
        <h1 class="text-center">Catálogo de <span class="text-primary-custom">Productos</span></h1>

        <form id="producto-form" autocomplete="off">
            <input type="hidden" id="edit-id" value="">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" class="form-control" placeholder="Código del producto">
                </div>
                <div class="col-md-6 form-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" class="form-control" placeholder="Nombre del producto">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 form-group">
                    <label for="linea">Línea</label>
                    <input type="text" id="linea" class="form-control" placeholder="Ej. Aqua, Terra...">
                </div>
                <div class="col-md-4 form-group">
                    <label for="valorPuntos">Valor en Puntos</label>
                    <input type="number" id="valorPuntos" class="form-control" placeholder="Pts">
                </div>
                <div class="col-md-4 form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" class="form-control" placeholder="Cantidad disponible">
                </div>
            </div>
            <input type="submit" id="submit-btn" value="Agregar Producto" class="btn btn-custom btn-block mt-3">
        </form>

        <div class="mt-5">
            <div class="row mb-3 align-items-center g-3">
                <div class="col-12 col-md-7 col-lg-8">
                    <input type="text" id="search" class="form-control"
                        placeholder="🔍 Buscar por código, producto o línea...">
                </div>
                <div class="col-12 col-md-5 col-lg-4 d-flex justify-content-md-end justify-content-center flex-wrap">
                    <button id="btn-exportar" class="btn btn-success me-2 mb-2 mb-md-0">📥 Excel</button>
                    <input type="file" id="input-importar" accept=".xlsx, .xls" class="d-none">
                    <button id="btn-importar" class="btn btn-primary mb-2 mb-md-0"
                        onclick="document.getElementById('input-importar').click()">📤 Subir Excel</button>
                </div>
            </div>

            <div class="d-flex justify-content-center mb-4">
                <div class="btn-group" role="group" aria-label="Filtro de categorías">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio-principales" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-info" for="btnradio-principales">🥘 Líneas Principales</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio-accesorios" autocomplete="off">
                    <label class="btn btn-outline-info" for="btnradio-accesorios">⚡ Accesorios</label>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Línea</th>
                            <th>Pts</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="producto-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
