<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Stock de Productos</title>
</head>

<body>
    <div class="container main-container">
        <h1 class="text-center">Catálogo de <span class="text-primary-custom">Productos</span></h1>

        <form id="producto-form" autocomplete="off">
            <input type="hidden" id="edit-id" value="">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" class="form-control" placeholder="Código del producto">
                </div>
                <div class="col-md-6 form-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" class="form-control" placeholder="Nombre del producto">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 form-group">
                    <label for="linea">Línea</label>
                    <input type="text" id="linea" class="form-control" placeholder="Ej. Aqua, Terra...">
                </div>
                <div class="col-md-4 form-group">
                    <label for="valorPuntos">Valor en Puntos</label>
                    <input type="number" id="valorPuntos" class="form-control" placeholder="Pts">
                </div>
                <div class="col-md-4 form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" class="form-control" placeholder="Cantidad disponible">
                </div>
            </div>
            <input type="submit" id="submit-btn" value="Agregar Producto" class="btn btn-custom btn-block mt-3">
        </form>

        <div class="mt-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <input type="text" id="search" class="form-control"
                    style="width: auto; flex-grow: 1; margin-right: 15px;"
                    placeholder="🔍 Buscar por código, producto o línea...">
                <div>
                    <button id="btn-exportar" class="btn btn-success" style="margin-right: 5px;">📥 Excel</button>
                    <input type="file" id="input-importar" accept=".xlsx, .xls" style="display: none;">
                    <button id="btn-importar" class="btn btn-primary"
                        onclick="document.getElementById('input-importar').click()">📤 Subir Excel</button>
                </div>
            </div>

            <table class="table table-hover text-center">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Línea</th>
                        <th>Pts</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="producto-list"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
